<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Em Construção - Portal Multiserviços</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #181c1f;
      --card-dark: #23282d;
      --primary-blue: #ca940f; 
      --primary-blue-dark: #007bff;
      --text-main: #f0f4f8;
      --text-secondary: #a5b1c2;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .navbar {
      background: linear-gradient(90deg, var(--primary-blue), var(--primary-blue-dark));
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .navbar-brand {
      font-weight: bold;
      color: white;
    }
    .logo-img {
      height: 40px;
    }
    .nav-link {
      color: white !important;
    }
    .nav-link:hover {
      color: var(--text-main) !important;
    }
    .construction {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }
    .construction i {
      font-size: 4em;
      color: var(--primary-blue);
      margin-bottom: 20px;
    }
    h1 {
      color: var(--primary-blue);
      font-size: 2.5em;
    }
    footer {
      background-color: #20262a;
      color: var(--text-secondary);
      padding: 20px;
      border-top: 1px solid #23282d;
      text-align: center;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="/logodb.png" alt="Logo" class="logo-img me-2" />
      Portal Multiserviços
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="construction">
  <i class="fas fa-tools"></i>
  <h1>🚧 Página em Construção 🚧</h1>
  <p class="lead">Estamos preparando algo incrível para você. Volte em breve!</p>
</div>

<footer>
  <p>&copy; 2025 Portal Multiserviços. Todos os direitos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
